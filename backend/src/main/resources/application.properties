# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=student-task-management-system

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/student_task_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Security JWT Configuration
app.jwt.secret=${JWT_SECRET:StudentTaskManagementSystemSuperSecretKeyWhichMustBeAtLeast256BitsLongForHmacSha256Algorithm}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days

# CORS Configuration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:*,http://localhost:5173,http://localhost:3000}

# OpenAPI / Swagger Documentation Config
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
